name: Scentmarked scheduled health check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required secret
        env:
          CRON_SECRET: ${{ secrets.ATLAS_MAINTENANCE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set ATLAS_MAINTENANCE_CRON_SECRET in GitHub Actions secrets and the Atlas Cloudflare Worker."
            exit 1
          fi
      - name: Check Scentmarked availability
        env:
          CRON_SECRET: ${{ secrets.ATLAS_MAINTENANCE_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            --retry 2 --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "https://ai-coworker-staging.m-worley816.workers.dev/api/maintenance/scentmarked/scheduled")
          echo "$response" | jq -e '.results | type == "array"' >/dev/null
          if echo "$response" | jq -e 'any(.results[]; .newOutage == true)' >/dev/null; then
            echo "::error::Scentmarked website outage confirmed after three consecutive failed checks. Review Atlas outage history."
            exit 1
          fi
          if echo "$response" | jq -e 'any(.results[]; .recovered == true)' >/dev/null; then
            echo "::notice::Scentmarked website recovered. Review Atlas outage history."
          fi
