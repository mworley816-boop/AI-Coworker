name: Atlas batch quality gate

on:
  pull_request:
    branches:
      - build/mvp-foundation
  push:
    branches:
      - build/mvp-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Maintenance tests
        run: npm run test:maintenance
      - name: Production build
        run: npm run build
