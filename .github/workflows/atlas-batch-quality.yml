name: Atlas batch quality gate

on:
  pull_request:
    branches:
      - build/mvp-foundation
  push:
    branches:
      - build/mvp-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo '::warning::No npm lockfile is committed; using npm install until a lockfile is added.'
            npm install --no-audit --no-fund
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Maintenance tests
        run: npm run test:maintenance
      - name: Production build
        run: npm run build

  staging-deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/mvp-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: atlas-staging-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dedicated Atlas Cloudflare credentials
        id: credentials
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_CLOUDFLARE_API_TOKEN }}
          ATLAS_ACCOUNT: ${{ secrets.ATLAS_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ATLAS_TOKEN" ] && [ -n "$ATLAS_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Atlas staging auto-deploy skipped: configure dedicated ATLAS_CLOUDFLARE_API_TOKEN and ATLAS_CLOUDFLARE_ACCOUNT_ID secrets."
            echo "Atlas staging auto-deploy skipped: dedicated Cloudflare secrets missing." >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build and deploy Atlas staging only
        if: steps.credentials.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATLAS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATLAS_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx opennextjs-cloudflare build
          npx wrangler deploy --config wrangler.jsonc
          echo "Atlas staging deployment succeeded." >> "$GITHUB_STEP_SUMMARY"
      - name: Staging HTTP smoke test
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --retry-connrefused --connect-timeout 10 --max-time 30 --output /dev/null "https://ai-coworker-staging.m-worley816.workers.dev/"
          echo "Atlas staging homepage returned a successful HTTP response." >> "$GITHUB_STEP_SUMMARY"
