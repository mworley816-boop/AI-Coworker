name: Atlas diagnostic unit tests

on:
  push:
    paths:
      - 'scripts/incident-history.mjs'
      - 'scripts/incident-history.test.mjs'
      - 'scripts/cloudflare-incident.mjs'
      - 'scripts/cloudflare-incident.test.mjs'
      - 'scripts/cloudflare-deployment-check.mjs'
      - 'scripts/cloudflare-deployment-check.test.mjs'
      - '.github/workflows/atlas-diagnostics-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/atlas-diagnostics-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only diagnostic unit tests
        run: node --test scripts/cloudflare-incident.test.mjs scripts/cloudflare-deployment-check.test.mjs scripts/incident-history.test.mjs
