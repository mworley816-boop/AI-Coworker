name: Atlas background worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-background-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate worker secret
        env:
          WORKER_SECRET: ${{ secrets.ATLAS_WORKER_SECRET }}
        run: |
          if [ -z "$WORKER_SECRET" ]; then
            echo "::error::Set ATLAS_WORKER_SECRET in GitHub Actions to match WORKER_SECRET in Atlas Cloudflare."
            exit 1
          fi
      - name: Process queued runs and recover completed runs
        env:
          WORKER_SECRET: ${{ secrets.ATLAS_WORKER_SECRET }}
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          status=$(curl --silent --show-error --max-time 240 \
            --output "$response_file" --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $WORKER_SECRET" \
            -H "Content-Type: application/json" \
            -H "x-worker-batch-size: 5" \
            "https://ai-coworker-staging.m-worley816.workers.dev/api/worker/run")
          echo "Worker HTTP status: $status"
          if [ "$status" != "200" ]; then
            jq -c '{ok,reason,error}' "$response_file" 2>/dev/null || echo "::error::Worker returned a non-JSON error response."
            exit 1
          fi
          jq -e '.ok == true' "$response_file" >/dev/null
          jq '{ok,processed,finalized,reportsRecovered,recovered,requeued,quarantined,idle,durationMs}' "$response_file"
