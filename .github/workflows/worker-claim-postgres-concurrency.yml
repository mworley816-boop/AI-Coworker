name: Atlas PostgreSQL Worker Concurrency

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/tests/worker-claim-postgres-concurrency.py"
      - "supabase/migrations/2026102701000*.sql"
      - ".github/workflows/worker-claim-postgres-concurrency.yml"

permissions:
  contents: read

jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: atlas_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATLAS_TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/atlas_concurrency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]==3.2.3"
      - name: Create local-only Supabase role placeholders
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["ATLAS_TEST_DATABASE_URL"], autocommit=True) as conn:
              for role in ("anon", "authenticated", "service_role"):
                  if conn.execute("SELECT 1 FROM pg_roles WHERE rolname=%s", (role,)).fetchone() is None:
                      conn.execute(f'CREATE ROLE "{role}" NOLOGIN')
          PY
      - name: Run actual concurrent PostgreSQL claims
        run: python supabase/tests/worker-claim-postgres-concurrency.py
